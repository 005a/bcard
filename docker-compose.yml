services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mycv
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U myuser -d mycv']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql://myuser:mypassword@database:5432/mycv?schema=public
      PORT: 3000
    depends_on:
      database:
        condition: service_healthy
    init: true
    ports:
      - '3000:3000'

volumes:
  postgres-data:
